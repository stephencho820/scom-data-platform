name: Deploy public site

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "data/**"
      - "config/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble static site
        run: |
          mkdir -p dist
          cp -R web/. dist/
          cp -R config dist/config
          mkdir -p dist/data
          if [ -d data/current ]; then cp -R data/current dist/data/current; fi
          if [ -d data/history ]; then cp -R data/history dist/data/history; fi
          if [ -d data/marts ]; then cp -R data/marts dist/data/marts; fi
          if [ -d data/manifests ]; then cp -R data/manifests dist/data/manifests; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
