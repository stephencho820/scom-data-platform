name: Crawl Samsung.com

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/crawl.yml"
  workflow_dispatch:
    inputs:
      max_pages:
        description: Pages per market
        required: false
        default: "80"
  schedule:
    - cron: "17 17 * * *"

permissions:
  contents: write

concurrency:
  group: scom-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Crawl configured markets sequentially
        id: crawl
        continue-on-error: true
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '80' }}
        run: |
          node -e "const c=require('./config/markets.json'); for(const m of c.markets) console.log(m.code)" > /tmp/markets.txt
          failures=0
          pages="$MAX_PAGES"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then pages=12; fi
          while read -r market; do
            echo "=== $market ==="
            if ! node scripts/crawl.mjs --market="$market" --max="$pages" --delay=700; then
              echo "Market $market failed; preserving its previous snapshot."
              failures=$((failures + 1))
            fi
          done < /tmp/markets.txt
          if [ "$failures" -gt 0 ]; then
            echo "$failures market crawl(s) failed."
            exit 1
          fi

      - name: Commit changed data
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "scom-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "data: refresh Samsung.com snapshots"
          git push

      - name: Fail workflow when any market crawl failed
        if: steps.crawl.outcome == 'failure'
        run: exit 1
