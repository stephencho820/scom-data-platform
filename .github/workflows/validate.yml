name: Validate project

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "scripts/**"
      - "src/**"
      - "config/**"
      - "web/**"
      - "schemas/**"
      - ".github/workflows/validate.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check scripts/crawl.mjs
          node --check scripts/build-status-page.mjs
          node --check scripts/build-demo-data.mjs
          node --check scripts/build-data-catalog.mjs
          node --check scripts/build-mart-gap.mjs
          node --check scripts/build-ai-ready.mjs
          node --check scripts/smoke-test-catalog.mjs
          node --check src/pipeline/incremental.mjs
          node --check src/pipeline/spec-pdp.mjs
          node --check src/pipeline/support-specs.mjs
          node --check src/pipeline/scheduler.mjs
          node --check src/mcp/server.mjs
          node --check web/site.js
          node --check web/poc.js
          node --check web/catalog.js
          node --check web/registry.js
          node --check web/ai-data.js
          node --check web/status.js
          node --check web/app.js
          node -e "JSON.parse(require('fs').readFileSync('config/markets.json','utf8')); console.log('markets.json ok')"

      - name: Test incremental lifecycle and retry logic
        run: node --test test/*.test.mjs

      - name: Install MCP dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify MCP SDK imports
        run: |
          node -e "Promise.all([import('@modelcontextprotocol/server'), import('@modelcontextprotocol/server/stdio'), import('zod/v4')]).then(()=>console.log('MCP imports ok'))"

      - name: Browser-level Data Catalog render smoke test
        env:
          CI: "true"
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "Chrome is required for Data Catalog end-to-end validation."
            exit 1
          fi
          mkdir -p dist
          cp -R web/. dist/
          node scripts/build-data-catalog.mjs dist/data/catalog/kr.json dist/catalog.html
          mkdir -p dist/schemas
          cp schemas/ai_ready_mart_registry_v1.json dist/schemas/
          node scripts/build-mart-gap.mjs dist/data/catalog/kr.json dist/data/gaps/kr.json
          node scripts/build-ai-ready.mjs kr dist/data/ai-ready/kr
          node scripts/build-demo-data.mjs dist/data/demo/kr.json
          CHROME_PATH="$chrome" node scripts/smoke-test-catalog.mjs dist
